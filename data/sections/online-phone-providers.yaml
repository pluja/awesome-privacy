title: Online Phone Providers
slug: online-phone-providers
intro: Many sites demand a phone number for verification, which ties your account to your real identity. These paid services give you a number to receive (and sometimes send) SMS without handing over your own.
subsections:
  - title: No email verification, accepting monero
    recommend:
      entries:
        - name: Crypton
          url: https://crypton.sh/
          description: Rents real SIM cards hosted in the cloud, with incoming SMS encrypted under a key you choose.
          added: 2022-09-02
        - name: MoneroSMS
          url: https://monerosms.com/
          description: Virtual numbers for sending and receiving SMS, paid in Monero, with a web app, a CLI and Tor support.
          tags:
            - tor
          added: 2022-11-23
  - title: Email verification required, accepting monero
    recommend:
      entries:
        - name: Onlinesim
          url: https://onlinesim.io/
          description: Temporary virtual numbers for receiving verification codes.
          caveats:
            - website-trackers
          added: 2022-09-02
  - title: Email verification required, accepting crypto
    recommend:
      entries:
        - name: Tiger SMS
          url: https://tiger-sms.com
          description: Temporary virtual numbers for anonymous SMS verification.
          caveats:
            - website-trackers
        - name: SmsPVA
          url: https://smspva.com/
          description: Temporary virtual numbers in many countries for receiving verification codes.
          caveats:
            - website-trackers
          added: 2022-09-02

title: Online Phone Providers
slug: online-phone-providers
intro: Many sites ask for a phone number, which ties your account to your identity. These paid services give you a number to receive SMS so you don't have to share your own. Numbers can be recycled and the provider sees every message, so don't use them for two-factor codes or account recovery.
recommend:
  entries:
    - name: Crypton
      url: https://crypton.sh/
      description: Rents real SIM cards hosted in the cloud, with incoming SMS encrypted under a key you choose.
      added: 2022-09-02
    - name: MoneroSMS
      url: https://monerosms.com/
      description: Virtual numbers for sending and receiving SMS, paid in Monero, with a web app, a CLI and Tor support.
      tags:
        - tor
      added: 2022-11-23

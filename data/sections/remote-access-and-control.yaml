title: Remote Access and Control
slug: remote-access-and-control
intro: Remote desktop tools can see and control everything on a machine, so trust matters more here than almost anywhere. Prefer open tools you can run on your own server, with no vendor account in the middle.
recommend:
  entries:
    - name: Apache Guacamole
      url: https://guacamole.apache.org
      repo: https://github.com/apache/guacamole-server
      description: Self-hosted gateway that gives you RDP, VNC and SSH access from a browser, with no client to install.
      license: Apache-2.0
      tags:
        - self-host
      added: 2026-07-04
    - name: Aspia
      url: https://aspia.org/
      repo: https://github.com/dchapyshev/aspia
      description: Remote desktop and file transfer with a router you can host yourself, so connections don't depend on a vendor.
      license: GPL-3.0
      tags:
        - self-host
      added: 2026-11-02
    - name: MeshCentral
      url: https://meshcentral.com/
      repo: https://github.com/Ylianst/MeshCentral
      description: Self-hosted web server for managing and remotely controlling many devices from a browser.
      license: Apache-2.0
      tags:
        - self-host
      added: 2021-05-27
    - name: Remmina
      url: https://remmina.org/
      repo: https://gitlab.com/Remmina/Remmina
      description: Remote desktop client for Linux that connects over RDP, VNC, SPICE and SSH.
      platforms:
        - linux
      added: 2021-05-23
    - name: RustDesk
      url: https://rustdesk.com/
      repo: https://github.com/rustdesk/rustdesk
      description: Remote desktop app that connects through its developers' public servers by default, which log your IP address, device and session details, or through a server you host.
      license: AGPL-3.0
      tags:
        - self-host
      caveats:
        - website-trackers
      package_id: com.carriez.flutter_hbb
      added: 2021-05-23
      fdroid: true
    - name: screego
      url: https://screego.net/
      repo: https://github.com/screego/server
      description: Self-hosted screen sharing over WebRTC, built for developers.
      license: GPL-3.0
      tags:
        - self-host
      added: 2021-05-23
    - name: Sunshine + Moonlight
      url: https://app.lizardbyte.dev/Sunshine
      repo: https://github.com/LizardByte/Sunshine
      description: Low-latency desktop and game streaming, with Sunshine on the host and Moonlight clients connecting to it.
      license: GPL-3.0
      tags:
        - self-host
      caveats:
        - website-trackers
      added: 2026-07-04
    - name: UltraVNC
      url: https://uvnc.com/
      repo: https://github.com/ultravnc/UltraVNC
      description: VNC server and viewer for Windows, with file transfer and optional encryption plugins.
      platforms:
        - windows
      license: GPL-3.0
      caveats:
        - website-trackers
      added: 2021-05-23

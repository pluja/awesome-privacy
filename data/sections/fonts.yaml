  - title: Foundries
    recommend:
      entries:
        - name: Velvetyne
          url: https://www.velvetyne.fr/
          description: French type foundry distributing libre, open source typefaces free for personal and commercial use.
          added: 2021-05-29
        - name: OpenFoundry
          url: https://open-foundry.com/
          description: Curated platform showcasing open source typefaces that are free to use and modify.
          added: 2021-05-12

title: Link Shorteners
slug: link-shorteners
intro: Hosted shorteners sit between every click and its destination, so they can log who opened what. Host your own, or use one that encrypts the target so the service can't read it.
avoid:
  items:
    - name: Bitly
      reason: built to track every click for marketing analytics.
      tosdr: en_224
recommend:
  entries:
    - name: Kutt
      url: https://kutt.to/
      repo: https://github.com/thedevs-network/kutt
      description: Shortener with custom domains and password-protected links that you can host yourself.
      license: MIT
      tags:
        - self-host
      added: 2026-07-04
    - name: MagLit
      url: https://maglit.me
      repo: https://github.com/NayamAmarshe/thiss.link
      description: Shortener that encrypts links with a password and also handles torrent magnet links.
      license: AGPL-3.0
      added: 2022-04-30
    - name: Shlink
      url: https://shlink.io/
      repo: https://github.com/shlinkio/shlink
      description: Self-hosted shortener that keeps its click statistics on your own server.
      license: MIT
      tags:
        - self-host
      added: 2026-07-04
    - name: tnyr.me
      url: https://tnyr.me
      repo: https://github.com/Sevi-py/tnyr.me
      description: Shortener with passwordless end-to-end encryption, so the server can't see where links point.
      license: MIT
      tags:
        - e2ee
      added: 2025-08-26
    - name: YOURLS
      url: https://yourls.org/
      repo: https://github.com/YOURLS/YOURLS
      description: Self-hosted shortener written in PHP, with its own click stats and a plugin system.
      license: MIT
      tags:
        - self-host
      added: 2024-09-25

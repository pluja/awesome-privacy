title: Bookmarking
slug: bookmarking
intro: Bookmarks and read-later lists reveal a lot about what you read and care about. Prefer a manager you host yourself, or one that syncs bookmarks through storage you already control.
avoid:
  items:
    - name: Evernote Web Clipper
      reason: in 2016 Evernote changed its policy to let staff read users' notes, until users pushed back.
      tosdr: en_207
      source: https://techcrunch.com/2016/12/14/evernotes-new-privacy-policy-allows-employees-to-read-your-notes/
      site: https://evernote.com/
recommend:
  entries:
    - name: 42links
      url: https://42links.tuxproject.de
      repo: https://code.rosaelefanten.org/42links
      description: Minimalist self-hosted bookmark storage.
      added: 2025-11-05
      tags:
        - self-host
    - name: Floccus
      url: https://floccus.org/
      repo: https://github.com/floccusaddon/floccus
      description: Syncs your bookmarks across browsers and devices through your own Nextcloud, WebDAV or Git server.
      license: MPL-2.0
      package_id: org.handmadeideas.floccus
      added: 2024-10-27
      fdroid: true
    - name: Grimoire
      url: https://github.com/goniszewski/grimoire
      repo: https://github.com/goniszewski/grimoire
      description: Self-hosted bookmark manager that extracts and keeps the readable content of what you save.
      license: MIT
      added: 2023-11-30
      tags:
        - self-host
    - name: Karakeep
      url: https://karakeep.com/
      repo: https://github.com/karakeep-app/karakeep
      description: Self-hosted app for saving links, notes and images, with full-text search and optional AI tagging, formerly Hoarder.
      license: AGPL-3.0
      added: 2025-11-05
      tags:
        - self-host
    - name: LinkAce
      url: https://github.com/Kovah/LinkAce
      repo: https://github.com/Kovah/LinkAce
      description: Self-hosted bookmark archive that monitors and organizes your saved links.
      license: GPL-3.0
      added: 2022-09-19
      tags:
        - self-host
    - name: LinkDing
      url: https://github.com/sissbruecker/linkding
      repo: https://github.com/sissbruecker/linkding
      description: Minimal, fast self-hosted bookmark manager that is easy to run with Docker.
      license: MIT
      added: 2022-09-19
      tags:
        - self-host
    - name: Shiori
      url: https://github.com/go-shiori/shiori
      repo: https://github.com/go-shiori/shiori
      description: Self-hosted bookmark manager written in Go, usable from the command line or a web interface.
      license: MIT
      added: 2022-09-19
      tags:
        - self-host
    - name: Wallabag
      url: https://wallabag.org/
      repo: https://github.com/wallabag/wallabag

title: Encryption
slug: encryption
intro: "Remember: Without strong encryption, you will be spied on systematically by lots of people."
avoid:
  items:
    - name: BitLocker
      reason: Proprietary Microsoft disk encryption. With device encryption, Windows uploads your recovery key to your Microsoft account by default.
recommend:
  entries:
    - name: Veracrypt
      url: https://www.veracrypt.fr/en/Home.html
      description: VeraCrypt is a free open source disk encryption software for Windows, macOS and Linux.
      added: 2020-12-09
    - name: Shufflecake
      url: https://shufflecake.net/index.html
      description: Free open source, plausible deniability for multiple hidden filesystems on Linux
      added: 2022-12-26
    - name: Hat.sh
      url: https://hat.sh/
      description: A Free, Fast, Secure and Serverless File Encryption.
      added: 2020-12-09
    - name: Cryptomator
      url: https://cryptomator.org/
      description: Cryptomator encrypts your data quickly and easily. Afterwards you upload them protected to your favorite cloud service.
      package_id: org.cryptomator.lite
      added: 2020-12-07
    - name: Stegcloak
      url: https://stegcloak.surge.sh/
      status: inactive
      description: Hide secrets with invisible characters in plain text securely using passwords.
      added: 2020-12-08
    - name: Photok
      url: https://github.com/leonlatsch/Photok
      description: Photok is a free Photo-Safe. It stores your photos encrypted on your device and hides them from others.
      repo: https://github.com/leonlatsch/Photok
      package_id: dev.leonlatsch.photok
      added: 2022-01-24
    - name: age
      url: https://age-encryption.org
      description: Modern command line file encryption tool with small keys and no configuration or keyring to manage. Open source, BSD-3 licensed.
      added: 2026-07-04
    - name: Tomb
      url: https://dyne.org/software/tomb/
      description: Command line tool to create and manage encrypted storage folders on GNU/Linux, built on standard LUKS and cryptsetup.
      added: 2026-09-30
subsections:
  - title: OS Encryption
    recommend:
      entries:
        - name: Cryptsetup
          url: https://gitlab.com/cryptsetup/cryptsetup
          description: Full disk encryption for Linux. Cryptsetup is a utility used to conveniently set up disk encryption based
          repo: https://gitlab.com/cryptsetup/cryptsetup
          added: 2022-06-27
    notes: on the DMCrypt kernel module.

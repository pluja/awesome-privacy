title: VPNs
slug: vpns
intro: A VPN doesn't make you anonymous; it moves the trust from your ISP to the VPN provider. Pick one that asks for no personal details, takes anonymous payment and publishes the source of its apps.
avoid:
  items:
    - name: Free VPNs
      reason: a 2017 study of 283 Android VPN apps found 75% used trackers and 38% contained malware.
      source: https://torrentfreak.com/researchers-issue-security-warning-over-android-vpn-apps-170125/
recommend:
  entries:
    - name: Amnezia VPN
      url: https://amnezia.org
      repo: https://github.com/amnezia-vpn/amnezia-client
      description: VPN client that sets up a server on a VPS you rent, with protocols designed to get past censorship.
      license: GPL-3.0
      tags:
        - self-host
        - audited
      added: 2026-07-04
    - name: Find more at kycnot.me (VPN Category)
      url: https://kycnot.me/?categories=vpn
      description: Directory of VPN providers that don't ask for identity documents.
      tags:
        - no-kyc
      added: 2026-07-04
    - name: IVPN
      url: https://ivpn.net
      repo: https://github.com/ivpn
      description: No-logs VPN that needs no email to sign up and takes cash, Monero or Bitcoin.
      tags:
        - anonymous-account
      package_id: net.ivpn.client
      added: 2022-07-28
      fdroid: true
    - name: Mullvad VPN
      url: https://mullvad.net
      repo: https://github.com/mullvad/mullvadvpn-app
      description: No-logs VPN with anonymous numbered accounts instead of email, payable in cash or cryptocurrency.
      license: GPL-3.0
      tags:
        - anonymous-account
      package_id: net.mullvad.mullvadvpn
      added: 2022-07-28
      fdroid: true
    - name: nadanada
      url: https://nadanada.me
      description: Pay-per-use WireGuard VPN with no account, payable in Bitcoin, Monero and other cryptocurrencies, formerly LNVPN.
      tags:
        - no-account
      added: 2025-06-17
    - name: Proton VPN
      url: https://protonvpn.com
      repo: https://github.com/ProtonVPN
      description: Swiss no-logs VPN with audited apps and a free tier with no data cap.
      tags:
        - audited
      package_id: ch.protonvpn.android
      added: 2023-01-21
      fdroid: true
      caveats:
        - telemetry-opt-out
    - name: SPN
      url: https://safing.io/spn/
      repo: https://github.com/safing/portmaster
      description: Paid add-on to the Portmaster firewall that routes each app's connections over separate multi-hop paths.
      platforms:
        - linux
        - windows
      license: GPL-3.0
      added: 2022-07-28

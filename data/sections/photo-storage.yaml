          repo: https://github.com/LibrePhotos/librephotos
          added: 2020-12-14
          tags:
            - self-host
        - name: Nextcloud
          url: https://nextcloud.com/
          description: The open source self-hosted productivity platform that keeps you in control. It has a [*Photos*](https://github.com/nextcloud/photos) plugin to help you organize and visualize your photos.
          added: 2020-12-07
          tags:
            - self-host
        - name: Photoprism
          url: https://photoprism.app
          description: Feature rich server-based application for browsing, organizing and sharing your personal photo collection. The most similar to Google Photos.

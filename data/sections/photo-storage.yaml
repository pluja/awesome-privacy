title: Photo Storage
slug: photo-storage
avoid:
  items:
    - name: Google Photos
      tosdr: en_217
      tools:
        - name: Google Photos Takeout Helper
          url: https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper
          status: inactive
          description: Script that organizes the Google Takeout messy archive into one big chronological folder. Use this script to get out of Google Photos :).
          repo: https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper
    - name: Amazon Photos
subsections:
  - title: Self-hosted
    recommend:
      entries:
        - name: Immich
          url: https://github.com/immich-app/immich
          description: Self-hosted photo and video backup solution directly from your mobile phone.
          repo: https://github.com/immich-app/immich
          package_id: app.alextran.immich
          added: 2025-06-17
          tags:
            - self-host
        - name: LibrePhotos
          url: https://github.com/LibrePhotos/librephotos

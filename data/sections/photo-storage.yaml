title: Photo Storage
slug: photo-storage
intro: Cloud photo services scan your library for faces, places and objects and tie it all to your account. Host your own photo server, or use an end-to-end encrypted service so only you can see your pictures.
avoid:
  items:
    - name: Google Photos
      reason: scans your photos, and in 2022 its scan got a father investigated by police over photos taken for a doctor.
      tosdr: en_217
      source: https://gizmodo.com/google-csam-photodna-1849440471
      site: https://photos.google.com/
      tools:
        - name: Google Photos Takeout Helper
          url: https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper
          repo: https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper
          description: Script that sorts the messy Google Takeout archive into one chronological folder, to help you move out of Google Photos.
          license: Apache-2.0
          status: inactive
          added: 2021-06-07
    - name: Amazon Photos
      reason: its privacy notice says Amazon uses the images you store with it to improve its services.
      source: https://www.amazon.com/gp/help/customer/display.html?nodeId=GX7NJQ4ZB8MHFRNJ
      site: https://www.amazon.com/photos
subsections:
  - title: Self-hosted
    term: self-hosted
    recommend:
      entries:
        - name: Ente
          url: https://ente.com/
          repo: https://github.com/ente/ente

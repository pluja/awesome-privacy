title: Captchas
slug: captchas
intro: Mainstream captchas tell humans from bots by profiling visitors. These make the visitor's browser solve a small proof-of-work puzzle instead, with no tracking needed.
avoid:
  items:
    - name: Google reCAPTCHA
      reason: its own docs tell sites to run it in the background of their pages, not just on forms.
      tosdr: en_217
      source: https://developers.google.com/recaptcha/docs/v3
      site: https://developers.google.com/recaptcha
    - name: hCaptcha
      reason: its privacy policy says it supplies the answers visitors give to its puzzles as AI training data.
      tosdr: en_2207
      source: https://www.hcaptcha.com/privacy
      site: https://www.hcaptcha.com/
recommend:
  entries:
    - name: ALTCHA
      url: https://altcha.org
      repo: https://github.com/altcha-org/altcha
      description: Self-hosted proof-of-work captcha with no cookies or tracking.
      license: MIT
      tags:
        - self-host
      added: 2024-06-17
    - name: mCaptcha
      url: https://mcaptcha.org/
      repo: https://github.com/mCaptcha/mCaptcha
      description: Proof-of-work captcha that rate-limits bots by making each request cost some computation.
      license: AGPL-3.0
      tags:
        - self-host
      added: 2023-08-09
    - name: Private Captcha
      url: https://privatecaptcha.com
      repo: https://github.com/PrivateCaptcha/PrivateCaptcha
      description: EU-made proof-of-work captcha, as a hosted service or on your own server.
      tags:
        - self-host
      caveats:
        - source-available
      added: 2025-10-20

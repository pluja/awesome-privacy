title: Pastebin and Secret Sharing
slug: pastebin-and-secret-sharing
intro: These tools are useful when sharing secrets, code snippets or any other kind of text with others in a private way.
recommend:
  entries:
    - name: crypt.fyi
      url: https://www.crypt.fyi
      description: Ephemeral zero-knowledge sensitive data sharing platform with web, cli, and chrome-extension clients
      added: 2025-01-27
    - name: NoPaste
      url: https://github.com/bokub/nopaste
      description: Open Source pastebin alternative that works with no database, and no back-end code. Instead, the data is compressed and stored entirely in the link that you share, nowhere else.
      repo: https://github.com/bokub/nopaste
      added: 2024-02-16
    - name: PrivateBin
      url: https://github.com/PrivateBin/PrivateBin
      description: A minimalist, open source online pastebin where the server has zero knowledge of pasted data. Data is encrypted/decrypted in the browser using 256 bits AES.
      repo: https://github.com/PrivateBin/PrivateBin
      added: 2022-09-21
    - name: Yopass
      url: https://github.com/jhaals/yopass
      description: Secure sharing of secrets, passwords and files.
      repo: https://github.com/jhaals/yopass
      added: 2022-09-21
    - name: scrt.link
      url: https://scrt.link
      description: Share a secret. End-to-end encrypted. Ephemeral. Open-source.
      added: 2025-06-17
      tags:
        - e2ee
    - name: dele-to
      url: https://dele.to
      description: Open Source. Modern app to share sensitive credentials and secrets securely with client-side AES-256 encryption, zero-knowledge architecture, and automatic self-destruction.
      added: 2025-08-26

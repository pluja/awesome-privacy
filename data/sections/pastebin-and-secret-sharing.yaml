title: Pastebin and Secret Sharing
slug: pastebin-and-secret-sharing
intro: Sending a password or a private note over chat or email leaves a copy in every inbox and backup. These tools encrypt the text in your browser and let it expire, so the server never sees it and nothing lingers.
recommend:
  entries:
    - name: crypt.fyi
      url: https://www.crypt.fyi
      description: Self-destructing secret sharing with end-to-end encryption, from the web, the command line or a browser extension.
      tags:
        - e2ee
      added: 2025-01-27
    - name: Deleto
      url: https://dele.to
      description: Shares passwords and other secrets with client-side encryption and automatic self-destruction.
      tags:
        - e2ee
      added: 2025-08-26
    - name: NoPaste
      url: https://github.com/bokub/nopaste
      repo: https://github.com/bokub/nopaste
      description: Pastebin with no server storage at all; the text is compressed into the link you share.
      license: MIT
      added: 2024-02-16
    - name: PrivateBin
      url: https://github.com/PrivateBin/PrivateBin
      repo: https://github.com/PrivateBin/PrivateBin
      description: Minimal pastebin where everything is encrypted in the browser, so the server knows nothing about what you paste.
      tags:
        - e2ee
        - self-host
      added: 2022-09-21
    - name: scrt.link
      url: https://scrt.link
      description: Shares end-to-end encrypted secrets that disappear after they're read.
      tags:
        - e2ee
      added: 2025-06-17
    - name: Yopass
      url: https://github.com/jhaals/yopass
      repo: https://github.com/jhaals/yopass
      description: Shares encrypted secrets and files through one-time links that expire.
      license: Apache-2.0
      tags:
        - e2ee
        - self-host
      added: 2022-09-21

title: Automation
slug: automation
intro: Cloud automation services hold access tokens for every account you connect and run your workflows on their servers. A self-hosted tool keeps those credentials and your data at home.
avoid:
  items:
    - name: IFTTT
      reason: your workflows run on its servers, holding tokens to all your connected accounts.
      tosdr: en_236
      site: https://ifttt.com/
    - name: Zapier
      reason: in 2025 an intruder got into its code repositories, where some customer data had been copied.
      tosdr: en_2131
      source: https://threats.wiz.io/all-incidents/zapier-data-breach
      site: https://zapier.com/
recommend:
  entries:
    - name: Huginn
      url: https://github.com/huginn/huginn
      repo: https://github.com/huginn/huginn
      description: Self-hosted agents that watch websites, feeds and APIs and act for you, an alternative to IFTTT and Zapier.
      license: MIT
      tags:
        - self-host
      added: 2026-11-02

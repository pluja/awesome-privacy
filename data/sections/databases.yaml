title: Databases
slug: databases
intro: "[![](https://shields.tosdr.org/en_217.svg)](https://tosdr.org/en/service/217)"
avoid:
  items: []
  intro: Avoid using privative databases which you don't control such as Google Firebase.
recommend:
  entries:
    - name: Appwrite
      url: https://appwrite.io/
      description: Secure open-source backend server for web, mobile & Flutter developers.
      added: 2021-05-23
    - name: Supabase
      url: https://supabase.com/
      description: Open source Firebase alternative ([Limited](https://github.com/supabase/supabase/issues/4934) [self-hosting](https://github.com/supabase/supabase/issues/4440#issuecomment-992108832))
      added: 2021-05-01
      tags:
        - self-host
    - name: Pocketbase
      url: https://pocketbase.io/
      description: Open Source backend in 1 file written in Go.
      added: 2022-07-11
    - name: TrailBase
      url: https://trailbase.io/
      description: Open source, single-executable Firebase alternative built on Rust and SQLite, with type-safe REST and realtime APIs, auth, and an admin UI. OSL-3.0 licensed.
      added: 2026-07-04
    - name: Baserow
      url: https://baserow.io/
      description: Self-hosted no-code database and spreadsheet that works as an open source Airtable alternative. MIT licensed core.
      added: 2026-07-04
      tags:
        - self-host

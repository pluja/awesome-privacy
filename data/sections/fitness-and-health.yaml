title: Fitness and Health
slug: fitness-and-health
intro: Health data is among the most sensitive data you have, and the most sought after. Skip the apps from Google, Fitbit, Huawei, Xiaomi and other data-hungry companies, and pick ones that keep your records on your device or your own server.
subsections:
  - title: Fitness trackers
    recommend:
      entries:
        - name: FitoTrack
          url: https://codeberg.org/jannis/FitoTrack
          repo: https://codeberg.org/jannis/FitoTrack
          description: Workout tracker that records your GPS activities and keeps them on the device.
          platforms:
            - android
          package_id: de.tadris.fitness
          added: 2020-12-28
        - name: OpenTracks
          url: https://opentracksapp.com/
          repo: https://codeberg.org/OpenTracksApp/OpenTracks
          description: Sport tracker that records your activities on the device and has no internet permission.
          platforms:
            - android
          tags:
            - offline
          added: 2021-06-15
        - name: Gadgetbridge
          url: https://gadgetbridge.org/
          repo: https://codeberg.org/Freeyourgadget/Gadgetbridge
          description: Use your smartwatch or fitness band without the vendor's app or cloud.
          platforms:
            - android
          added: 2024-07-22
        - name: FitTrackee
          url: https://codeberg.org/FitTrackee/FitTrackee
          repo: https://codeberg.org/FitTrackee/FitTrackee
          description: Self-hosted Strava alternative for recording and analyzing outdoor activities from GPS files.
          tags:
            - self-host
          added: 2026-07-04
        - name: RunnerUp
          url: https://github.com/jonasoreland/runnerup
          repo: https://github.com/jonasoreland/runnerup
          description: Run and bike tracker that keeps activities on the device, with optional sync to services like Strava.
          platforms:
            - android
          license: GPL-3.0
  - title: Workout planners
    recommend:
      entries:
        - name: wger
          url: https://wger.de/
          repo: https://github.com/wger-project/wger
          description: Self-hosted manager for your workouts, exercises and nutrition.
          license: AGPL-3.0
          tags:
            - self-host
          added: 2020-12-28
  - title: Food
    recommend:
      entries:
        - name: Open Food Facts
          url: https://world.openfoodfacts.org/
          repo: https://github.com/openfoodfacts/openfoodfacts-server
          description: Collaborative database of food products, with ingredients, additives and nutrition data.
          license: AGPL-3.0
          children:
            - name: OFF Apps
              url: https://world.openfoodfacts.org/open-food-facts-mobile-app
              repo: https://github.com/openfoodfacts/smooth-app
              description: Mobile apps that scan a product's barcode and show its ingredients, additives and nutrition data.
              platforms:
                - android
                - ios
              license: Apache-2.0
              added: 2020-12-28
          added: 2020-12-28
  - title: Menstrual cycle trackers
    intro: Cycle data is intimate. Rather than mainstream trackers like Clue or Period Tracker, use one that keeps it on your device or encrypts it end to end.
    recommend:
      entries:
        - name: Bluemoon
          url: https://gitlab.com/ngrob/bluemoon-android
          repo: https://gitlab.com/ngrob/bluemoon-android
          description: Period tracker that keeps your data on the device.
          platforms:
            - android
          package_id: ch.nilsgrob.android.bluemoon
          added: 2024-04-30
        - name: Drip
          url: https://dripapp.org/
          repo: https://gitlab.com/bloodyhealth/drip
          description: Menstrual cycle and fertility tracker that keeps everything you enter on your device.
          platforms:
            - android
            - ios
          package_id: com.drip
          added: 2020-12-28
        - name: Euki
          url: https://eukiapp.org/
          repo: https://github.com/Euki-Inc/Euki-Android
          description: Period and sexual health tracker built to keep your data on your phone.
          platforms:
            - android
            - ios
          license: GPL-3.0
          caveats:
            - website-trackers
          added: 2024-04-30
        - name: Periodical
          url: https://codeberg.org/askaaron/periodical
          repo: https://codeberg.org/askaaron/periodical
          description: Calendar for tracking your period and estimating fertile days.
          platforms:
            - android
          package_id: de.arnowelzel.android.periodical
          added: 2024-09-25
        - name: Poppy
          url: https://poppy.usenostr.org
          description: Period tracker in the browser that stores data locally and can sync end-to-end encrypted through Nostr relays, no account needed.
          tags:
            - e2ee
            - no-account
          added: 2026-05-25
  - title: Medical health
    recommend:
      entries:
        - name: MedTimer
          url: https://github.com/Futsch1/medTimer
          repo: https://github.com/Futsch1/medTimer
          description: Medication reminder that keeps all data on the device and has no internet permission.
          platforms:
            - android
          license: MIT
          tags:
            - offline
            - no-account
          package_id: com.futsch1.medtimer
          added: 2026-11-02
        - name: Fasten
          url: https://github.com/fastenhealth/fasten-onprem
          repo: https://github.com/fastenhealth/fasten-onprem
          description: Self-hosted personal and family medical record that pulls records from insurers, hospitals and clinics.
          license: GPL-3.0
          status: inactive
          tags:
            - self-host
          added: 2023-05-16

          description: Odysee is a video platform backed by the creators of lbry and uses the lbry blockchain protocol.
          package_id: com.odysee.floss
          added: 2020-12-09
        - name: DTube
          url: https://github.com/dtube/dtube
          description: A full-featured video sharing website, decentralized.
          repo: https://github.com/dtube/dtube
          added: 2020-12-08
    subsections:

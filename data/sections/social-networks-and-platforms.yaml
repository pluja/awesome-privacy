  - title: Twitter
    intro: "[![](https://shields.tosdr.org/en_195.svg)](https://tosdr.org/en/service/195)"
    avoid:
      items: []
      intro: Avoid using Twitter official app / website. It tracks users and creates user profiles based on what they follow, retweet and like. Twitter harms and violates user privacy with their policies [by default](https://www.eff.org/deeplinks/2017/05/how-opt-out-twitters-new-privacy-settings).

      - title: Decentralized
        recommend:
          entries:
            - name: Nostr
              url: https://nostr.com/
              description: "Open protocol that is able to create a censorship-resistant global \"social\" network. It doesn't rely on any trusted central server, hence it is resilient; it is based on cryptographic keys and signatures, so it is tamperproof; it does not rely on P2P techniques, therefore it works. **Note**: Nostr is a protocol, so it is capable of offering much more than a Twitter alternative."
              repo: https://nostr.com/
              added: 2022-12-15
              tags:
                - p2p
            - name: Mastodon
              url: https://joinmastodon.org/
              tags:
                - activitypub
              description: Free, federated microblogging social network built on open protocols.
              children:
                - name: Mastodon Apps
                  url: https://joinmastodon.org/apps
                  description: List of Mastodon apps for Android, iOS, Web and Desktop.
                  added: 2022-04-15
              package_id: org.joinmastodon.android
              added: 2020-12-09
            - name: Pleroma
              url: https://pleroma.social/
              tags:
                - activitypub
              description: Pleroma is a free, federated social networking server built on open protocols.
              children:
                - name: Soapbox
                  url: https://gitlab.com/soapbox-pub/soapbox-fe
                  description: A frontend for Pleroma with a focus on custom branding and ease of use.
                  repo: https://gitlab.com/soapbox-pub/soapbox-fe
                  added: 2020-12-09
              added: 2020-12-09
        callouts:
          - type: note
            text: "**Federated social networks**: A federated social network isn't a single website like Twitter or Facebook, it's a network of thousands of communities operated by different organizations and individuals that provide a seamless social media experience."
      - title: Alternative Frontends

title: Social Networks and Platforms
slug: social-networks-and-platforms
intro: The big platforms profile you from everything you read, watch and like, and their feeds are built to keep you there. Federated networks let you choose your server and still reach everyone, and alternative frontends let you read the big sites without an account or their tracking.
callouts:
  - type: note
    text: |-
      **The fediverse**

      The fediverse is a network of independent servers and apps that talk to each other over the open ActivityPub protocol. You can follow people on any of them from whichever one you join, and move elsewhere if you're unhappy. [This video by Framasoft](https://framatube.org/w/9dRFC6Ya11NCVeYKn8ZhiD?start=8s) explains the idea.

      Apps that speak ActivityPub carry the `ActivityPub` badge.
  - type: note
    text: |-
      **Alternative frontends and clients**

      Frontends let you read these services without an account, ads or their scripts. The service still sees requests for the content you view, and only frontends that route everything through their own server hide your IP address from it. Public instances get blocked often, so expect to switch instances or self-host.

      These tools redirect links to alternative frontends automatically:
      - [LibRedirect](https://github.com/libredirect/browser_extension#get): browser extension that sends YouTube, Reddit, X and other links to alternative frontends.
      - [UntrackMe](https://www.f-droid.org/en/packages/app.fedilab.nitterizeme/): Android app that rewrites YouTube, Twitter and other links to their open source alternatives.
subsections:
  - title: Blogging platforms (Medium)
    avoid:
      items:
        - name: Medium
          reason: the site carries Google trackers and ads.
        - name: Blogger
          reason: owned by Google, with Google trackers and ads.
    recommend:
      entries:
        - name: Plume
          url: https://joinplu.me/
          repo: https://git.joinplu.me/plume/plume
          description: Federated blogging engine where readers can follow and comment from any ActivityPub account.
          tags:
            - activitypub
          status: inactive
          added: 2022-10-04
        - name: WriteFreely
          url: https://writefreely.org/
          repo: https://github.com/writefreely/writefreely
          description: Minimal, distraction-free blogging platform that can federate posts over ActivityPub.
          license: AGPL-3.0
          tags:
            - activitypub
          added: 2022-10-04
    subsections:
      - title: Alternative Medium frontends
        recommend:
          entries: []
  - title: Instagram
    avoid:
      items:
        - name: Instagram
          reason: owned by Meta, which builds an ad profile from what you view, like and follow, and the feed is designed to keep you scrolling.
          tosdr: en_219
    recommend:
      entries:
        - name: Pixelfed
          url: https://pixelfed.org/
          repo: https://github.com/pixelfed/pixelfed
          description: Federated photo sharing with posts, stories and a chronological feed, without ads.
          license: AGPL-3.0
          tags:
            - activitypub
          added: 2020-12-07
  - title: Quora
    avoid:
      items:
        - name: Quora
          reason: the site is full of ads and third-party trackers, and hides answers until you sign in.
          tosdr: en_314
    recommend:
      entries: []
  - title: YouTube
    avoid:
      items:
        - name: YouTube
          reason: Google builds a detailed profile from everything you watch, and the recommendations have been [studied](https://arxiv.org/pdf/1908.08313.pdf) for [pushing viewers toward more extreme content](https://www.pcmag.com/news/does-youtubes-algorithm-lead-to-radicalization).
          tosdr: en_274
    recommend:
      entries:
        - name: PeerTube
          url: https://joinpeertube.org/en/
          repo: https://github.com/Chocobozzz/PeerTube
          description: Federated video hosting where anyone can run an instance and follow channels across others.
          license: AGPL-3.0
          tags:
            - activitypub
          added: 2020-12-07
    subsections:
      - title: YouTube alternative frontends (web-based)
        recommend:
          entries:
            - name: Invidious
              url: https://invidious.io/
              repo: https://github.com/iv-org/invidious
              description: YouTube frontend with no ads or Google scripts and subscriptions without an account; see the [public instances](https://docs.invidious.io/instances/).
              license: AGPL-3.0
              added: 2020-12-07
            - name: Piped
              url: https://github.com/TeamPiped/Piped
              repo: https://github.com/TeamPiped/Piped
              description: YouTube frontend that never connects your browser to Google, with feeds, playlists and SponsorBlock.
              license: AGPL-3.0
              added: 2020-12-07
            - name: ViewTube
              url: https://github.com/ViewTube/viewtube
              repo: https://github.com/ViewTube/viewtube
              description: YouTube frontend without ads or tracking, with its own accounts, subscriptions and SponsorBlock.
              license: AGPL-3.0
              added: 2021-10-29
            - name: youtube-local
              url: https://github.com/user234683/youtube-local
              repo: https://github.com/user234683/youtube-local
              description: YouTube client that runs on your computer and opens in the browser, with local subscriptions and optional routing through Tor.
              platforms:
                - desktop
              license: AGPL-3.0
              tags:
                - tor
              added: 2021-09-15
      - title: YouTube alternative clients (apps)
        recommend:
          entries:
            - name: FreeTube
              url: https://freetubeapp.io/
              repo: https://github.com/FreeTubeApp/FreeTube
              description: Desktop YouTube app that keeps subscriptions, playlists and history on your computer, without Google's cookies or scripts.
              platforms:
                - desktop
              license: AGPL-3.0
              added: 2020-12-08
            - name: LibreTube
              url: https://libretube.dev/
              repo: https://github.com/libre-tube/LibreTube
              description: Android YouTube app that fetches videos through Piped instead of Google's servers.
              platforms:
                - android
              license: GPL-3.0
              package_id: com.github.libretube
              added: 2022-03-19
              fdroid: true
            - name: NewPipe
              url: https://newpipe.net/
              repo: https://github.com/TeamNewPipe/NewPipe
              description: Lightweight Android YouTube app with background play and downloads, no Google services or account needed.
              platforms:
                - android
              license: GPL-3.0
              tags:
                - no-account
              package_id: org.schabi.newpipe
              added: 2020-12-07
              fdroid: true
            - name: SkyTube
              url: https://github.com/SkyTubeTeam/SkyTube
              repo: https://github.com/SkyTubeTeam/SkyTube
              description: Android YouTube app with local subscriptions, downloads and a channel and video blocker.
              platforms:
                - android
              license: GPL-3.0
              tags:
                - no-account
              package_id: free.rm.skytube.oss
              added: 2021-05-29
              fdroid: true
            - name: Yattee
              url: https://github.com/yattee/yattee
              repo: https://github.com/yattee/yattee
              description: Native YouTube player for iPhone, iPad, Apple TV and Mac that works through Invidious or Piped.
              platforms:
                - ios
                - macos
              license: AGPL-3.0
              added: 2022-03-20
  - title: TikTok
    avoid:
      items:
        - name: TikTok
          reason: collects extensive data about you and your device to drive a feed designed to be hard to put down.
          tosdr: en_1448
    recommend:
      entries: []
  - title: Twitter
    avoid:
      items:
        - name: Twitter (X)
          reason: profiles you from who you follow and what you like and repost, with [privacy-invasive defaults](https://www.eff.org/deeplinks/2017/05/how-opt-out-twitters-new-privacy-settings).
          tosdr: en_195
    subsections:
      - title: Self-hosted
        recommend:
          entries: []
      - title: Decentralized
        callouts:
          - type: note
            text: "**Federated social networks** aren't a single website: they're thousands of communities run by different people and organizations, which can all follow and reply to each other."
        recommend:
          entries:
            - name: Mastodon
              url: https://joinmastodon.org/
              repo: https://github.com/mastodon/mastodon
              description: Federated microblogging, the largest network in the fediverse.
              license: AGPL-3.0
              tags:
                - activitypub
              package_id: org.joinmastodon.android
              added: 2020-12-09
              children:
                - name: Mastodon Apps
                  url: https://joinmastodon.org/apps
                  description: Official directory of Mastodon apps for Android, iOS, web and desktop.
                  added: 2022-04-15
              fdroid: true
            - name: Nostr
              url: https://nostr.com/
              repo: https://github.com/nostr-protocol/nips
              description: Open protocol where posts are signed with your own keys and spread across relays, so no single server controls your account.
              added: 2022-12-15
            - name: Pleroma
              url: https://git.pleroma.social/pleroma/pleroma
              repo: https://git.pleroma.social/pleroma/pleroma
              description: Lightweight federated social network server.
              tags:
                - activitypub
              added: 2020-12-09
              children:
                - name: Soapbox
                  url: https://gitlab.com/soapbox-pub/soapbox-fe
                  repo: https://gitlab.com/soapbox-pub/soapbox-fe
                  description: Web frontend for Pleroma focused on custom branding and ease of use.
                  added: 2020-12-09
      - title: Alternative Frontends
        recommend:
          entries:
            - name: Nitter
              url: https://github.com/zedeus/nitter
              repo: https://github.com/zedeus/nitter
              description: Twitter frontend without JavaScript or ads that proxies every request; see the [instances list](https://github.com/zedeus/nitter/wiki/Instances).
              license: AGPL-3.0
              status: inactive
              added: 2020-12-09
            - name: Squawker
              url: https://github.com/j-fbriere/squawker
              repo: https://github.com/j-fbriere/squawker
              description: Android Twitter client with no account, tracking or ads, keeping subscriptions on the device; the maintained fork of Fritter.
              platforms:
                - android
              license: MIT
              package_id: org.ca.squawker
              added: 2021-03-21
              fdroid: true
  - title: Reddit
    avoid:
      items:
        - name: Reddit
          reason: the official site and apps are full of trackers and ads.
          tosdr: en_194
    subsections:
      - title: Reddit alternatives
        recommend:
          entries:
            - name: Lemmy
              url: https://join-lemmy.org/
              repo: https://github.com/LemmyNet/lemmy
              description: Federated link aggregator and discussion forum, organized into communities like subreddits.
              license: AGPL-3.0
              tags:
                - activitypub
              added: 2020-12-09
            - name: Mbin
              url: https://joinmbin.org/
              repo: https://github.com/MbinOrg/mbin
              description: Federated link aggregator with microblogging, the community-run continuation of kbin.
              license: AGPL-3.0
              tags:
                - activitypub
              added: 2026-07-04
      - title: Privacy respecting Reddit clients
        recommend:
          entries:
            - name: Redlib
              url: https://github.com/redlib-org/redlib
              repo: https://github.com/redlib-org/redlib
              description: Reddit frontend without JavaScript that proxies all requests, media included; see the [instances](https://github.com/redlib-org/redlib-instances). Formerly Libreddit.
              license: AGPL-3.0
              added: 2024-04-10
  - title: Streaming Platforms (Twitch)
    avoid:
      items:
        - name: Twitch
          reason: owned by Amazon and funded by ads, so viewers are tracked for advertising.
          tosdr: en_200
    recommend:
      entries:
        - name: Owncast
          url: https://owncast.online/
          repo: https://github.com/owncast/owncast
          description: Self-hosted live streaming server with built-in chat, so you own the stream and your viewers' data.
          license: MIT
          tags:
            - self-host
          added: 2020-12-21
    subsections:
      - title: Privacy respecting Twitch clients
        recommend:
          entries:
            - name: Twire
              url: https://github.com/twireapp/Twire
              repo: https://github.com/twireapp/Twire
              description: Android Twitch client with built-in ad blocking, VODs with chat replay, and optional login.
              platforms:
                - android
              license: GPL-3.0
              package_id: com.perflyst.twire
              added: 2026-09-30
              fdroid: true
  - title: Imgur
    avoid:
      items:
        - name: Imgur
          reason: the site is heavy with ads, cookies, scripts and trackers.
          tosdr: en_325
    recommend:
      entries:
        - name: rimgo
          url: https://codeberg.org/rimgo/rimgo
          repo: https://codeberg.org/rimgo/rimgo
          description: Read-only Imgur frontend that works without JavaScript; see the [instances](https://rimgo.codeberg.page/).
          added: 2022-03-08
  - title: IMDb
    avoid:
      items:
        - name: IMDb
          reason: owned by Amazon, with ads and third-party trackers on the site.
    recommend:
      entries:
        - name: libremdb
          url: https://github.com/zyachel/libremdb
          repo: https://github.com/zyachel/libremdb
          description: IMDb frontend without ads or tracking that proxies images and video through the instance.
          license: AGPL-3.0
          tags:
            - self-host
          added: 2026-07-04
  - title: Fandom
    avoid:
      items:
        - name: Fandom
          reason: wikis are loaded with ads, autoplaying video and trackers.
    recommend:
      entries:
        - name: BreezeWiki
          url: https://breezewiki.com/
          repo: https://gitdab.com/cadence/breezewiki
          description: Fandom frontend that strips ads, video and suggested content; also on several [mirrors](https://docs.breezewiki.com/Links.html).
          tags:
            - self-host
          added: 2026-07-04

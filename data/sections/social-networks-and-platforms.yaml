  - title: Instagram
    intro: "[![](https://shields.tosdr.org/en_219.svg)](https://tosdr.org/en/service/219)"
    avoid:
      items: []
      intro: Don't use Instagram (or at least the official client). Instagram is a very privacy-invasive app with biased results and feeds based on user profiles, it is also used as a manipulation tool and has a lot of censorship going against free speech. Lastly, it has an addictive and toxic UI design.
    subsections:
      - title: Alternatives to Instagram
        recommend:
          entries:
            - name: Pixelfed
              url: https://pixelfed.org/
              tags:
                - activitypub
              description: Decentralized, federated and Open Source alternative to Instagram with posts, videos, stories, tags, etc.
              added: 2020-12-07
  - title: Quora

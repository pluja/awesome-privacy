  - title: YouTube
    intro: "[![](https://shields.tosdr.org/en_274.svg)](https://tosdr.org/en/service/274)"
    avoid:
      items: []
      intro: "Don't use YouTube (or at least the official client). YouTube is very privacy invasive, it generates a very accurate profile based on your interests. Also it is a [radicalization tool](https://www.pcmag.com/news/does-youtubes-algorithm-lead-to-radicalization) which shows [biased content to users](https://arxiv.org/pdf/1908.08313.pdf) in order to get more engagement and to get them to watch more and more content creating an [addiction](https://medium.com/dataseries/how-youtube-is-addictive-259d5c575883). It never shows you [alternative opinions](https://arxiv.org/pdf/1908.08313.pdf) to your ideology/bias. YouTube censors a lot. YouTube collects a LOT of your data: interests, free time, ideology, likes, dislikes, music taste, etc."
    recommend:
      entries:
        - name: Peertube
          url: https://joinpeertube.org/en/
          tags:
            - activitypub
          description: A free, open and decentralized alternative to video platforms.
          added: 2020-12-07

title: Routers
slug: routers
avoid:
  items:
    - name: "Stock ISP routers and vendor firmware: closed source, slow or missing security updates, and often phone home to the vendor or ISP."
recommend:
  entries:
    - name: OpenWrt
      url: https://openwrt.org/
      description: Open source Linux firmware that replaces the stock software on hundreds of consumer routers, with years of security updates.
      repo: https://github.com/openwrt/openwrt
      added: 2026-09-30
    - name: OPNsense
      url: https://opnsense.org/
      description: Open source firewall and routing platform based on FreeBSD, for dedicated hardware or a spare PC.
      repo: https://github.com/opnsense/core
      license: BSD-2-Clause
      added: 2026-09-30
    - name: IPFire
      url: https://www.ipfire.org/
      description: Hardened open source Linux firewall distribution with intrusion prevention and a web interface.
      added: 2026-09-30

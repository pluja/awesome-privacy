title: Notes and Tasks
slug: notes-and-tasks
intro: Popular note apps store everything you write on their servers, usually readable by the provider and wrapped in trackers. Prefer apps that keep notes on your device or encrypt them end to end before syncing.
avoid:
  items:
    - name: Google Keep
      reason: notes are stored on Google's servers without end-to-end encryption.
      tosdr: en_217
      site: https://keep.google.com/
      tools:
        - name: Keep To Markdown
          url: https://github.com/erikelisath/keep-to-markdown
          repo: https://github.com/erikelisath/keep-to-markdown
          description: Converts your Google Keep notes to Markdown files with a YAML header.
          added: 2024-11-08
    - name: Evernote
      reason: in 2016 Evernote changed its policy to let staff read users' notes, until users pushed back.
      tosdr: en_207
      source: https://techcrunch.com/2016/12/14/evernotes-new-privacy-policy-allows-employees-to-read-your-notes/
      site: https://evernote.com/
    - name: Notion
      reason: no end-to-end encryption, so Notion can read everything in your workspace.
      tosdr: en_1817
      site: https://www.notion.com/
    - name: OneNote
      reason: notes sync through Microsoft's servers without end-to-end encryption.
      tosdr: en_244
      site: https://www.onenote.com/
recommend:
  entries:
    - name: AFFiNE
      url: https://affine.pro
      repo: https://github.com/toeverything/AFFiNE
      description: Local-first knowledge base that keeps docs, a whiteboard and databases on your device, as an alternative to Notion and Miro.
      tags:
        - offline
      caveats:
        - source-available
        - telemetry-opt-out
        - website-trackers
    - name: AppFlowy
      url: https://appflowy.com/
      repo: https://github.com/AppFlowy-IO/AppFlowy
      description: Notion alternative for docs, wikis and task boards that you can run locally or host yourself.
      license: AGPL-3.0
      caveats:
        - website-trackers
      added: 2021-12-14
    - name: HedgeDoc

title: Notes and Tasks
slug: notes-and-tasks
avoid:
  items:
    - name: Google Keep
      tools:
        - name: Keep To Markdown
          url: https://github.com/erikelisath/keep-to-markdown
          description: Convert your Google Keep notes into a standard markdown + YAML header format.
          repo: https://github.com/erikelisath/keep-to-markdown
          added: 2024-11-08
    - name: Evernote
    - name: Squid
    - name: Notion
    - name: OneNote
  intro: These providers offer apps and services filled with data trackers. Also, most of them store your notes on their servers and do not offer any kind of encryption.
recommend:
  entries:
    - name: Anytype
      url: https://www.anytype.io/
      description: An open-source Notion alternative. E2EE, cloud and local network sync, can be self-hosted.
      added: 2023-09-22
      tags:
        - self-host
        - e2ee
    - name: AppFlowy
      url: https://appflowy.com/
      description: Open Source Notion Alternative. You are in charge of your data and customizations.
      added: 2021-12-14
    - name: HedgeDoc
      url: https://hedgedoc.org/
      description: Formerly CodiMD (community). An awesome platform to write and share markdown.
      added: 2021-12-14
    - name: Joplin
      url: https://github.com/laurent22/joplin
      description: Note taking and to-do application with synchronisation and encryption capabilities.
      repo: https://github.com/laurent22/joplin
      package_id: net.cozic.joplin
      added: 2021-05-25
    - name: Logseq
      url: https://logseq.com/
      description: A privacy-first alternative to WorkFlowy.
      package_id: com.logseq.app
      added: 2021-05-26
    - name: Lockbook
      url: https://github.com/lockbook/lockbook
      description: End-to-end encrypted Evernote alternative for notes, documents and drawings, with apps for Android, iOS, macOS, Windows and Linux plus a CLI. Public domain (Unlicense), self-hostable.
      repo: https://github.com/lockbook/lockbook
    - name: Memos
      url: https://github.com/usememos/memos
      description: An open-source, self-hosted memo hub with knowledge management and socialization.
      repo: https://github.com/usememos/memos
      added: 2022-12-20
      tags:
        - self-host
    - name: Nextcloud Notes
      url: https://github.com/nextcloud/notes/
      description: The Notes app is a distraction free notes taking app for Nextcloud.
      children:
        - name: Nextcloud Notes app
          url: https://github.com/nextcloud/notes-android
          description: An android client for Nextcloud Notes.
          repo: https://github.com/nextcloud/notes-android
          package_id: it.niedermann.owncloud.notes
          added: 2021-06-02
      repo: https://github.com/nextcloud/notes/
      added: 2021-06-02
    - name: Notally
      url: https://github.com/OmGodse/Notally
      description: A beautiful notes app (local only, no sync).
      repo: https://github.com/OmGodse/Notally
      package_id: com.omgodse.notally
      added: 2021-03-21
    - name: Notesnook
      url: https://notesnook.com/
      description: Open source zero knowledge private note taking.
      package_id: com.streetwriters.notesnook
      added: 2022-09-02
    - name: Obsidian
      url: https://obsidian.md
      description: Obsidian is the private and flexible note‑taking app. Closed source but has no trackers (website / apps) and E2EE sync.
      added: 2023-08-25
      tags:
        - e2ee
    - name: Quillpad
      url: https://quillpad.github.io/
      description: Take beautiful markdown notes and stay organized with task lists. Fork of Quillnote.
      package_id: io.github.quillpad
      added: 2024-04-28
    - name: SiYuan
      url: https://github.com/siyuan-note/siyuan
      description: A local-first personal knowledge management system.
      repo: https://github.com/siyuan-note/siyuan
      added: 2022-10-23
    - name: Standard Notes
      url: https://standardnotes.com/
      description: A free, open-source, and completely encrypted notes app.
      package_id: com.standardnotes
      added: 2021-03-21
    - name: Super Productivity
      url: https://github.com/super-productivity/super-productivity
      description: To-do list and time tracker that keeps data local with no account, with optional sync over WebDAV or Dropbox. MIT licensed.
      repo: https://github.com/super-productivity/super-productivity
    - name: TinyList
      url: https://tinylist.app/
      description: Create and share notes and checklists, without sacrificing your privacy.
      added: 2021-03-21
    - name: Trilium Notes
      url: https://github.com/TriliumNext/Trilium
      description: Build your personal knowledge base with Trilium Notes
      repo: https://github.com/TriliumNext/Trilium
      added: 2023-01-09
    - name: Vikunja
      url: https://vikunja.io
      description: The open-source to-do app to organize your life.
      added: 2021-06-08
    - name: YankNote
      url: https://github.com/purocean/yn
      description: A Hackable Markdown Note Application for Programmers.
      repo: https://github.com/purocean/yn
      added: 2022-05-19
    - name: Tasks.org
      url: https://tasks.org
      platforms:
        - android
      description: Open source to-do and task manager for Android with CalDAV sync and offline use. GPL-3.0 licensed.
      package_id: org.tasks
      added: 2026-07-04
      tags:
        - offline

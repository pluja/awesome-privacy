title: Whistleblowing
slug: whistleblowing
intro: Platforms for receiving leaks and reports without exposing the source. They run on infrastructure the organisation controls instead of a hosted portal or email inbox.
recommend:
  entries:
    - name: GlobaLeaks
      url: https://www.globaleaks.org/
      repo: https://github.com/globaleaks/globaleaks-whistleblowing-software
      description: Whistleblowing platform for organisations, newsrooms and activists, reachable over Tor.
      license: AGPL-3.0
      tags:
        - self-host
        - tor
      added: 2026-09-30
    - name: SecureDrop
      url: https://securedrop.org/
      repo: https://github.com/freedomofpress/securedrop
      description: Submission system that lets newsrooms receive documents from anonymous sources over Tor.
      tags:
        - self-host
        - tor
        - audited
      added: 2026-09-30

          repo: https://github.com/resemble-ai/chatterbox
          added: 2026-07-04
  - title: Speech to Text
    subsections:
      - title: Models
        recommend:
          entries:
            - name: Moonshine
              url: https://github.com/moonshine-ai/moonshine
              description: Fast and accurate automatic speech recognition (ASR) for edge devices.
              repo: https://github.com/moonshine-ai/moonshine
              added: 2026-03-21
            - name: OpenAI Whisper
              url: https://github.com/openai/whisper
              description: Whisper is a general-purpose speech recognition model that can be run locally offline. It can transcribe audio from and to multiple languages.
              children:
                - name: whisper.cpp
                  url: https://github.com/ggml-org/whisper.cpp
                  description: High-performance inference of OpenAI's Whisper automatic speech recognition (ASR) model.
                  repo: https://github.com/ggml-org/whisper.cpp
                  added: 2023-04-28
                - name: faster-whisper
                  url: https://github.com/SYSTRAN/faster-whisper
                  description: Reimplementation of Whisper using CTranslate2 that transcribes locally up to four times faster. MIT licensed.
                  repo: https://github.com/SYSTRAN/faster-whisper
                  added: 2026-07-04
              repo: https://github.com/openai/whisper
              added: 2022-09-23
              tags:
                - offline
            - name: FunASR
              url: https://github.com/modelscope/FunASR
              description: Speech recognition toolkit that runs locally, with voice activity detection, punctuation restoration and speaker diarization. Downloads models from ModelScope by default. MIT licensed code, model licenses vary.
              repo: https://github.com/modelscope/FunASR
              license: MIT
              added: 2026-11-02
              tags:
                - offline
            - name: ParakeetTDT
              url: https://parakeettdt.com/
              description: Efficient audio transcription. Convert speech to text with unprecedented speed and accuracy using NVIDIA advanced AI speech recognition model.
              added: 2026-03-21
      - title: Apps and services

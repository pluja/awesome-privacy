title: Artificial Intelligence
slug: artificial-intelligence
intro: When using cloud-based AI services, the data you input is often collected and stored by the service provider. This may include not only the content of your requests but also metadata, such as timestamps or IP addresses. Third-party servers may grant access to your data to their employees, partners, or even other users, depending on their privacy policies. Data may be used for various purposes, including model training, research, or even marketing activities. Your requests to a third-party AI service may be tied to your user information and payment details, linking your data to your identity.
subsections:
  - title: ChatGPT
    recommend:
      entries:
        - name: Jan
          url: https://github.com/janhq/jan
          description: Jan is an open source alternative to ChatGPT that runs 100% offline on your computer.
          repo: https://github.com/janhq/jan
          added: 2024-02-10
          tags:
            - offline
        - name: llama.cpp
          url: https://github.com/ggml-org/llama.cpp
          description: Inference of Facebook's LLaMA model in pure C/C++ so it can run locally on a CPU.
          repo: https://github.com/ggml-org/llama.cpp
          added: 2023-03-12
        - name: LocalAI
          url: https://github.com/mudler/LocalAI
          description: Self-hosted, community-driven simple local OpenAI-compatible API written in go. Can be used as a drop-in replacement for OpenAI, running on CPU with consumer-grade hardware.
          repo: https://github.com/mudler/LocalAI
          added: 2023-04-21
          tags:
            - self-host
        - name: ollama
          url: https://github.com/ollama/ollama
          description: Get up and running with Llama 2 and other large language models locally.
          repo: https://github.com/ollama/ollama
          added: 2023-10-26
        - name: PasteGuard
          url: https://github.com/sgasser/pasteguard
          description: Privacy proxy for LLM APIs that masks PII and secrets before they reach cloud providers. Self-hosted, OpenAI-compatible, and restores original data in responses.
          repo: https://github.com/sgasser/pasteguard
          added: 2026-02-16
          tags:
            - self-host
        - name: Shimmy
          url: https://github.com/Michael-A-Kuykendall/shimmy
          description: Privacy-focused AI inference server with OpenAI API compatibility, zero cloud dependencies, and local model processing.
          repo: https://github.com/Michael-A-Kuykendall/shimmy
          added: 2025-10-20
        - name: Tinfoil
          url: https://tinfoil.sh/
          description: Verifiably private AI Chat and OpenAI-compatible inference in the cloud. Uses NVIDIA confidential computing and open source code pinned to a transparency log for end-to-end verifiability.
          added: 2025-10-20
          tags:
            - e2ee
        - name: Open WebUI
          url: https://openwebui.com
          description: Self-hosted web interface for Ollama and other local models that gives you a private ChatGPT-style chat. BSD-3 licensed.
          added: 2026-07-04
          tags:
            - self-host
        - name: LibreChat
          url: https://librechat.ai
          description: Self-hosted chat interface that connects many AI models behind one private UI you control. Open source, MIT licensed.
          added: 2026-07-04
          tags:
            - self-host

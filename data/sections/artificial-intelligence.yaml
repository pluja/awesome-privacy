              added: 2026-03-17
            - name: Sasayaki
              url: https://github.com/pluja/sasayaki
              description: Tiny android dictation app that turns speech into clear writing.
              repo: https://github.com/pluja/sasayaki
              added: 2026-03-21
            - name: Speaches
              url: https://github.com/speaches-ai/speaches
              description: OpenAI API-compatible server supporting streaming transcription, translation, and speech generation.
              repo: https://github.com/speaches-ai/speaches
              added: 2026-03-21

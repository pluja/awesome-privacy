title: Ebooks
slug: ebooks
intro: Commercial ebook platforms track your reading, tie your books to an account that can be revoked, and expect you to stay online. Keep your library on your own devices or your own server instead.
avoid:
  items:
    - name: Amazon Kindle
      reason: in 2009 Amazon remotely deleted copies of 1984 that people had bought from their Kindles.
      source: https://www.theregister.com/2009/07/18/amazon_removes_1984_from_kindle/
      site: https://www.amazon.com/kindle
    - name: Google Play Books
      reason: its privacy policy says the record of each book you buy, title included, can't be deleted.
      tosdr: en_217
      source: https://books.google.com/googlebooks/privacy.html
      site: https://play.google.com/books
recommend:
  entries:
    - name: Calibre
      url: https://calibre-ebook.com/
      repo: https://github.com/kovidgoyal/calibre
      description: Ebook manager with format conversion, metadata editing and a built-in reader, all offline.
      platforms:
        - linux
        - macos
        - windows
      license: GPL-3.0
      tags:
        - offline
      caveats:
        - website-trackers
      added: 2026-09-30
    - name: Kavita
      url: https://www.kavitareader.com/
      repo: https://github.com/Kareadita/Kavita
      description: Self-hosted digital library for ebooks and comics with a built-in web reader.
      license: GPL-3.0
      tags:
        - self-host
      caveats:
        - website-trackers
      added: 2026-09-30
    - name: Komga
      url: https://komga.org/
      repo: https://github.com/gotson/komga
      description: Self-hosted server for comics, magazines and ebooks with a web reader and OPDS support.
      license: MIT
      tags:
        - self-host
      added: 2026-09-30

title: Ebooks
slug: ebooks
avoid:
  items:
    - name: Amazon Kindle
      reason: Tracks reading activity, requires an Amazon account, and has a documented history of [remote deletion](https://www.nytimes.com/2009/07/18/technology/18kindle.html).
    - name: Google Play Books
      reason: Tied to a Google account, tracks reading data, and does not offer an offline-only mode.
    - name: Kobo / Apple Books
      reason: Require accounts and sync reading data to company servers by default.
  intro: Commercial ebook platforms track your reading habits, tie purchases to accounts that can be revoked, and require constant online activation.
recommend:
  entries:
    - name: Calibre
      url: https://calibre-ebook.com/
      description: Open-source ebook manager for Linux, Windows, and macOS with format conversion, metadata editing, and a built-in reader (GPL-3.0).
      repo: https://github.com/kovidgoyal/calibre
      license: GPL-3.0
      added: 2026-09-30
      platforms:
        - linux
        - windows
        - macos
      tags:
        - offline
    - name: Kavita
      url: https://github.com/Kareadita/Kavita
      description: Cross-platform self-hosted digital library for ebooks and comics with a built-in web reader (GPL-3.0).
      repo: https://github.com/Kareadita/Kavita
      license: GPL-3.0
      added: 2026-09-30
      tags:
        - self-host
    - name: Komga
      url: https://github.com/gotson/komga
      description: Self-hosted media server for comics, magazines, and ebooks with a responsive web interface and OPDS support (MIT).
      repo: https://github.com/gotson/komga
      license: MIT
      added: 2026-09-30
      tags:
        - self-host

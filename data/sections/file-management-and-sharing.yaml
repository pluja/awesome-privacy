title: File Management and Sharing
slug: file-management-and-sharing
avoid:
  items:
    - name: WeTransfer
      reason: "[Bad privacy policy](https://tosdr.org/en/service/214). Files are not e2e encrypted. Website has many analytics and trackers."
    - name: SendAnywhere
      reason: No e2e encryption. Website has loads of analytics and trackers from Facebook, Google, Cloudflare...
recommend:
  entries:
    - name: Blaze
      url: https://blaze.vercel.app/
      description: A fast, p2p and radically different way to transfer files.
      added: 2021-02-10
      tags:
        - p2p
    - name: Blindsend
      url: https://github.com/blindnet-io/blindsend
      status: inactive
      description: Open source tool for private, end-to-end encrypted file exchange.
      repo: https://github.com/blindnet-io/blindsend
      added: 2022-05-14
      tags:
        - e2ee
    - name: Croc
      url: https://github.com/schollz/croc
      description: Easily and securely send things from one computer to another.
      repo: https://github.com/schollz/croc
      added: 2020-12-09
    - name: Dat-cp
      url: https://github.com/tom-james-watson/dat-cp
      status: inactive
      description: Copy files between hosts on a network using the peer-to-peer Dat network.
      repo: https://github.com/tom-james-watson/dat-cp
      added: 2020-12-09
      tags:
        - p2p
    - name: Destiny
      url: https://leastauthority.com/community-matters/destiny/
      description: Send files directly to the receiver in real-time. Developed for and with HROs as a free Privacy Enhancing Technology alternative.
      added: 2023-03-06
    - name: Gokapi
      url: https://github.com/Forceu/Gokapi
      description: Lightweight selfhosted Firefox Send alternative without public upload. AWS S3 supported.
      repo: https://github.com/Forceu/Gokapi
      added: 2025-08-26
      tags:
        - self-host
    - name: Lufi
      url: https://framagit.org/fiat-tux/hat-softwares/lufi
      description: Let's Upload that FIle — File sharing software.
      repo: https://framagit.org/fiat-tux/hat-softwares/lufi
      added: 2020-12-09
    - name: Localsend
      url: https://localsend.org/
      description: Share files to nearby devices. Free, open source, cross-platform.
      package_id: org.localsend.localsend_app
      added: 2023-03-22
    - name: Magic Wormhole
      url: https://github.com/magic-wormhole/magic-wormhole
      description: Get things from one computer to another, safely.
      repo: https://github.com/magic-wormhole/magic-wormhole
      added: 2022-01-05
    - name: OnionShare
      url: https://github.com/onionshare/onionshare
      description: An open source tool that lets you securely and anonymously share files, host websites, and chat with friends using the Tor network.
      repo: https://github.com/onionshare/onionshare
      added: 2021-06-07
      tags:
        - tor
    - name: Paperless-ngx
      url: https://github.com/paperless-ngx/paperless-ngx
      description: A community-supported supercharged version of paperless based on paperless-ng
      repo: https://github.com/paperless-ngx/paperless-ngx
      added: 2022-10-02
    - name: PairDrop
      url: https://github.com/schlagmichdoch/PairDrop
      description: An improved version of Snapdrop that also allows you to pair devices and share files outside your network.
      repo: https://github.com/schlagmichdoch/PairDrop
      added: 2023-01-21
    - name: QRcp
      url: https://github.com/claudiodangelis/qrcp
      description: Transfer files over wifi from your computer to your mobile device by scanning a QR code without leaving the terminal.
      repo: https://github.com/claudiodangelis/qrcp
      added: 2020-12-09
    - name: Send
      url: https://gitlab.com/timvisee/send
      description: Simple, private file sharing. (Mozilla Send Fork)
      repo: https://gitlab.com/timvisee/send
      added: 2021-05-09
    - name: Sharik
      url: https://github.com/marchellodev/sharik
      status: inactive
      description: Sharik works with Wi-Fi connection or Tethering (Wi-Fi Hotspot). No internet connection needed. Available for Android, iOS, Linux, MacOS & Windows.
      repo: https://github.com/marchellodev/sharik
      package_id: dev.marchello.sharik
      added: 2021-10-22
    - name: Snapdrop
      url: https://github.com/RobinLinus/snapdrop
      description: A Progressive Web App for local file sharing inspired by Apple's Airdrop.
      repo: https://github.com/RobinLinus/snapdrop
      added: 2020-12-15
    - name: Winden
      url: https://winden.app/
      description: A convenient version of Magic Wormhole you can use from within your browser. No need to install an app.
      added: 2023-03-06
    - name: Yopass
      url: https://github.com/jhaals/yopass
      description: Secure sharing of secrets, passwords and files.
      repo: https://github.com/jhaals/yopass
      added: 2022-09-21
    - name: scrt.link
      url: https://scrt.link/file
      description: End-to-end encrypted file transfer. Up to 100GB and 30 days retention. Stored in Switzerland.
      added: 2025-06-17
      tags:
        - e2ee

title: Design Tools
slug: design-tools
intro: "**Adobe**'s dominance in design tools restricts designers' choices and compromises their privacy. Its [lack of Linux support](https://helpx.adobe.com/in/download-install/kb/operating-system-guidelines.html), confines designers to Windows or macOS. Plus, Adobe's [data collection via Creative Cloud](https://tosdr.org/en/service/417) and [trackers](https://reports.exodus-privacy.eu.org/en/reports/com.adobe.psmobile/latest/) further amplifies privacy concerns. They also may be [using users' work to train their AIs](https://mastodon.art/@Krita/109632425661190494), potentially causing intellectual property problems. For these reasons, designers can consider using open-source, privacy-respecting alternatives, bypassing most of these issues."
subsections:
  - title: InDesign
    recommend:
      entries:
        - name: Scribus
          url: https://www.scribus.net/
          description: a free and open-source desktop publishing (DTP) software available for most desktop operating systems. It is designed for layout, typesetting, and preparation of files for professional-quality image-setting equipment. Scribus can also create animated and interactive PDF presentations and forms.
          added: 2023-08-16
  - title: Photoshop / Illustrator
    recommend:
      entries:
        - name: GIMP
          url: https://www.gimp.org/
          description: A free and open-source raster graphics editor used for image manipulation (retouching) and image editing, free-form drawing, transcoding between different image file formats, and more specialized tasks. It is not designed to be used for drawing, though some artists and creators have used it in this way.
          added: 2020-12-09
        - name: Inkscape
          url: https://inkscape.org/
          description: A free and open-source vector graphics editor for GNU/Linux, Windows and macOS. It offers a rich set of features and is widely used for both artistic and technical illustrations such as cartoons, clip art, logos, typography, diagramming and flowcharting.
          added: 2021-06-02
        - name: Krita
          url: https://krita.org/
          description: A free and open-source raster graphics editor designed primarily for digital art and 2D animation.
          added: 2020-12-28
        - name: LibreSprite
          url: https://github.com/LibreSprite/LibreSprite
          description: Free and open source sprite editor and pixel-art animation tool, forked from Aseprite before its license change. GPL-2.0 licensed.
          repo: https://github.com/LibreSprite/LibreSprite
        - name: Excalidraw
          url: https://github.com/excalidraw/excalidraw
          description: Virtual whiteboard for sketching hand-drawn like diagrams.
          repo: https://github.com/excalidraw/excalidraw
          added: 2023-08-29
  - title: Figma
    recommend:
      entries:
        - name: Penpot
          url: https://penpot.app/
          description: Penpot is an Open Source design and prototyping platform for product teams.
          added: 2023-08-16

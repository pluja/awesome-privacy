title: Forms
slug: forms
intro: Hosted form builders collect every answer your respondents give on the provider's servers. Prefer a form tool that encrypts responses end to end or runs on your own server.
avoid:
  items:
    - name: Google Forms
      reason: responses are stored on Google's servers without end-to-end encryption.
      tosdr: en_217
      site: https://www.google.com/forms/about/
recommend:
  entries:
    - name: TypeBot
      url: https://typebot.com
      repo: https://github.com/baptisteArno/typebot.io
      description: Builder for conversational, chat-style forms that you can host yourself.
      caveats:
        - source-available
      added: 2022-05-19
      tags:
        - self-host
    - name: CryptPad Forms
      url: https://cryptpad.fr/form/
      repo: https://github.com/cryptpad/cryptpad
      description: End-to-end encrypted forms and polls, part of the CryptPad collaboration suite.
      license: AGPL-3.0
      added: 2022-05-19
      tags:
        - e2ee
        - self-host
    - name: FramaForms
      url: https://framaforms.org/
      description: Online form and survey service run by the French nonprofit Framasoft.
      added: 2022-05-19

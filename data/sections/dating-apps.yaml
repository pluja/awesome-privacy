title: Dating Apps
slug: dating-apps
intro: Mainstream dating apps collect intimate data and profit from it. Tinder in particular has been found to [charge some users up to five times more for the same service](https://www.mozillafoundation.org/en/blog/new-research-tinders-opaque-unfair-pricing-algorithm-can-charge-users-up-to-five-times-more-for-same-service/), [estimate your intelligence and other traits and pass them to third parties](https://www.reddit.com/r/privacy/comments/k7x4s7/tinder_extrapolates_estimations_on_your/), and [keep far more about you than you might expect](https://www.theguardian.com/technology/2017/sep/26/tinder-personal-data-dating-app-messages-hacked-sold).
avoid:
  items:
    - name: Tinder
      reason: a 2020 Norwegian Consumer Council study found it shared user data with at least 45 Match Group firms.
      tosdr: en_462
      exodus: com.tinder
      source: https://www.thelocal.no/20200114/norway-consumer-rights-group-accuses-tinder-grindr-of-illegally-sharing-data
      site: https://tinder.com/
    - name: Grindr
      reason: fined NOK 65 million in Norway in 2021 for sharing users' data with advertisers without valid consent.
      source: https://techcrunch.com/2021/12/15/grindr-final-gdpr-fine/
      site: https://www.grindr.com/
    - name: Badoo
      reason: settled for $40 million in 2024, with Bumble, over claims it scanned Illinois users' faces.
      exodus: com.badoo.mobile
      source: https://idtechwire.com/illinoisan-bumble-badoo-users-may-get-payout-from-40-million-biometric-privacy-settlement/
      site: https://badoo.com/
    - name: Lovoo
      reason: in 2019 journalists used its Radar feature to locate users to within 30 to 50 meters.
      exodus: net.lovoo.android
      source: https://netzpolitik.org/2019/sicherheitsluecke-dating-app-lovoo-gibt-standortdaten-preis/
      site: https://www.lovoo.com/
recommend:
  entries:
    - name: Alovoa
      url: https://alovoa.com/
      repo: https://github.com/Alovoa/alovoa
      description: Dating platform with no ads, no paid features and no selling of your data.
      license: AGPL-3.0
      package_id: com.alovoa.expo
      added: 2022-03-02
      fdroid: true

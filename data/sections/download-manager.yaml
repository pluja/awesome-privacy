title: Download Manager
slug: download-manager
intro: A download manager sees every file you fetch and every site you fetch it from. These resume and speed up downloads without ads or bundled extras, and their code is open to inspect.
recommend:
  entries:
    - name: Persepolis Download Manager
      url: https://persepolisdm.github.io
      repo: https://github.com/persepolisdm/persepolis
      description: Graphical front end for aria2 with download scheduling and video grabbing.
      license: GPL-3.0
      platforms:
        - desktop
      added: 2021-10-22
    - name: Motrix
      url: https://motrix.app
      repo: https://github.com/agalwood/Motrix
      description: Full-featured download manager for HTTP, FTP, BitTorrent and magnet links.
      platforms:
        - desktop
      added: 2021-10-22
    - name: Xtreme Download Manager
      url: https://xtremedownloadmanager.com/
      repo: https://github.com/subhra74/xdm
      description: Download accelerator that resumes broken downloads and saves streaming video from many sites.
      license: GPL-3.0
      platforms:
        - desktop
      caveats:
        - website-trackers
      added: 2021-10-22
    - name: axel
      url: https://github.com/axel-download-accelerator/axel
      repo: https://github.com/axel-download-accelerator/axel
      description: Lightweight download accelerator for HTTP, HTTPS, FTP and FTPS.
      license: GPL-2.0
      platforms:
        - cli
      added: 2021-11-23

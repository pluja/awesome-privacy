title: Password Managers
slug: password-managers
intro: A password manager lets you use a strong, different password for every account without remembering any of them. Prefer one that encrypts your vault on your device, so not even its sync server can read it.
avoid:
  items:
    - name: LastPass
      reason: a 2022 breach leaked customers' encrypted vaults and, unencrypted, the sites they saved.
      source: https://en.wikipedia.org/wiki/2022_LastPass_data_breach
recommend:
  entries:
    - name: AliasVault
      url: https://www.aliasvault.com
      repo: https://github.com/aliasvault/aliasvault
      description: End-to-end encrypted password manager with a built-in email alias server.
      license: AGPL-3.0
      tags:
        - e2ee
        - self-host
      added: 2025-06-17
    - name: Bitwarden
      url: https://bitwarden.com
      repo: https://github.com/bitwarden/clients
      description: Password manager with end-to-end encrypted sync across all your devices.
      tags:
        - e2ee
        - self-host
      added: 2020-12-09
      children:
        - name: Vaultwarden
          url: https://github.com/dani-garcia/vaultwarden
          repo: https://github.com/dani-garcia/vaultwarden
          description: Lightweight, unofficial Bitwarden-compatible server you can host yourself.
          license: AGPL-3.0
          tags:
            - self-host
          added: 2021-05-09
      caveats:
        - website-trackers
    - name: KeePassXC
      url: https://keepassxc.org/
      repo: https://github.com/keepassxreboot/keepassxc
      description: Offline password manager that keeps your vault in an encrypted file you control, with no account or sync service.
      platforms:
        - linux
        - macos
        - windows
      tags:
        - offline
      added: 2020-12-09
      children:
        - name: KeePassDX
          url: https://www.keepassdx.com/
          repo: https://github.com/Kunzisoft/KeePassDX
          description: KeePass-compatible password manager for Android.
          platforms:
            - android
          license: GPL-3.0
          package_id: com.kunzisoft.keepass.libre
          added: 2020-12-09
          fdroid: true
        - name: Strongbox
          url: https://strongboxsafe.com/
          repo: https://github.com/strongbox-password-safe/Strongbox
          description: KeePass-compatible password manager for iPhone, iPad and Mac.
          platforms:
            - ios
            - macos
          license: AGPL-3.0
          added: 2020-12-09
    - name: LessPass
      url: https://www.lesspass.com
      repo: https://github.com/lesspass/lesspass
      description: Stateless password manager that computes each password from your master password, so there's nothing to store or sync.
      license: GPL-3.0
      package_id: com.lesspass.android
      added: 2022-05-14
      fdroid: true
    - name: Passbolt
      url: https://www.passbolt.com
      repo: https://github.com/passbolt/passbolt_api
      description: Password manager built for teams, with end-to-end encrypted sharing.
      license: AGPL-3.0
      tags:
        - e2ee
        - self-host
      added: 2023-02-28
      caveats:
        - website-trackers
    - name: Passky
      url: https://passky.org
      repo: https://github.com/Rabbit-Company/Passky-Server
      description: Small, simple password manager with a server you can host yourself.
      license: EUPL-1.2
      tags:
        - self-host
      package_id: com.rabbitcompany.passky
      added: 2022-04-11
      fdroid: true
    - name: Proton Pass
      url: https://proton.me/pass
      description: End-to-end encrypted password manager with built-in email aliases, from the makers of Proton Mail.
      tags:
        - e2ee
      package_id: proton.android.pass.fdroid
      added: 2023-08-05
      fdroid: true

title: Password Managers
slug: password-managers
avoid:
  items:
    - name: LastPass
    - name: Dashlane
recommend:
  entries:
    - name: AliasVault
      url: https://www.aliasvault.com
      description: An open source E2EE password & alias manager with a built-in email alias server
      added: 2025-06-17
      tags:
        - e2ee
    - name: Bitwarden
      url: https://bitwarden.com
      description: An open source cloud based password manager.
      children:
        - name: vaultwarden
          url: https://github.com/dani-garcia/vaultwarden/
          description: Unofficial Bitwarden compatible self-hosted server, formerly known as bitwarden_rs.
          repo: https://github.com/dani-garcia/vaultwarden/
          added: 2021-05-09
          tags:
            - self-host
      added: 2020-12-09
    - name: CarryPass
      url: https://carrypass.net
      description: Zero-knowledge PWA password manager with deterministic generation, encrypted vaults, and team collaboration. ([Source](https://github.com/racz-zoltan/racz-zoltan.github.io)) `MIT`
      added: 2025-06-17
    - name: KeepassXC
      url: https://keepassxc.org/
      description: Securely store passwords using industry standard encryption, no sync just storage.
      children:
        - name: KeepassDX
          url: https://www.keepassdx.com/
          description: for Android.
          package_id: com.kunzisoft.keepass.libre
          added: 2020-12-09
        - name: Strongbox
          url: https://strongboxsafe.com/
          description: for iOS.
          added: 2020-12-09
        - name: KeeWeb
          url: https://keeweb.info/
          description: for Web and other platforms.
          added: 2020-12-09
      added: 2020-12-09
    - name: LessPass
      url: https://www.lesspass.com
      description: Stateless password manager. Remember one master password to access your passwords. No sync needed.
      package_id: com.lesspass.android
      added: 2022-05-14
    - name: Padloc
      url: https://padloc.app/
      description: The last password manager you'll ever want to use.
      added: 2020-12-21
    - name: Passbolt
      url: https://www.passbolt.com
      description: An open source password manager designed for team collaboration.
      added: 2023-02-28
    - name: Passky
      url: https://passky.org
      description: Simple, modern, lightweight, open-source and secure password manager.
      package_id: com.rabbitcompany.passky
      added: 2022-04-11
    - name: Proton Pass
      url: https://proton.me/pass
      description: Open-source and encrypted password manager by Proton.
      package_id: proton.android.pass.fdroid
      added: 2023-08-05

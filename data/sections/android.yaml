title: Android
slug: android
intro: Apps to replace the Google and manufacturer defaults on an Android phone, and the stores to get them from.
subsections:
  - title: Android App Store
    avoid:
      items:
        - name: Google Play Store
          tosdr: en_217
    recommend:
      entries:
        - name: Accrescent
          url: https://accrescent.app/
          repo: https://github.com/accrescent/accrescent
          description: App store that pins each app's signing key on first install and signs its repository metadata, still in alpha.
          platforms:
            - android
          license: Apache-2.0
          added: 2023-05-22
        - name: F-Droid
          url: https://f-droid.org/
          repo: https://gitlab.com/fdroid/fdroidclient
          description: Catalogue of open source Android apps, built from source and labelled when they contain trackers or ads.
          platforms:
            - android
          added: 2021-05-29
          children:
            - name: Droid-ify
              url: https://droidify.app/
              repo: https://github.com/Droid-ify/client
              description: F-Droid client with a clean interface that can browse any F-Droid repository.
              platforms:
                - android
              license: GPL-3.0
              package_id: com.looker.droidify
              added: 2021-10-30
        - name: FossDroid
          url: https://fossdroid.com/
          repo: https://github.com/SnaKKo/Fossdroid-Core
          description: Website that lays out the F-Droid catalogue like an app store, sorted by new, trending and popular apps.
          license: MIT
          added: 2021-05-29
        - name: Obtainium
          url: https://obtainium.imranr.dev/
          repo: https://github.com/ImranR98/Obtainium
          description: Installs and updates apps straight from their release pages, such as GitHub or GitLab, and tells you about new versions.
          platforms:
            - android
          license: GPL-3.0
          package_id: dev.imranr.obtainium.fdroid
          added: 2023-02-28
  - title: Alternative Google Play Store clients
    recommend:
      entries:
        - name: Aurora Store
          url: https://auroraoss.com/
          repo: https://gitlab.com/AuroraOSS/AuroraStore
          description: Google Play client that can download apps anonymously, without a Google account.
          platforms:
            - android
          caveats:
            - website-trackers
          added: 2021-05-29
  - title: Android Debloat Tools
    avoid:
      items:
        - name: ADB AppControl
          reason: an adb wrapper whose [privacy policy](https://adbappcontrol.com/en/terms/) lets it collect device information and which apps you install or uninstall.
    recommend:
      entries:
        - name: Universal Android Debloater Next Generation
          url: https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation
          repo: https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation
          description: Desktop app that removes preinstalled bloatware from Android phones over ADB, no root needed.
          platforms:
            - desktop
          license: GPL-3.0
          added: 2025-08-06
  - title: Android Dialer
    avoid:
      intro: Dialers from the Play Store may carry ads or trackers and ask for permissions they don't need.
      items: []
    recommend:
      entries:
        - name: Fossify Phone
          url: https://www.fossify.org/apps/phone/
          repo: https://github.com/FossifyOrg/Phone
          description: Phone app with a phonebook, number blocking and multi-SIM support, part of the Fossify fork of Simple Mobile Tools.
          platforms:
            - android
          license: GPL-3.0
          package_id: org.fossify.phone
          added: 2025-08-06
  - title: Android File Manager
    avoid:
      intro: Preinstalled file managers and those from the Play Store may carry ads or trackers and ask for permissions they don't need.
      items: []
    recommend:
      entries:
        - name: Amaze File Manager
          url: https://github.com/TeamAmaze/AmazeFileManager
          repo: https://github.com/TeamAmaze/AmazeFileManager
          description: Material Design file manager with root access and a built-in FTP server.
          platforms:
            - android
          license: GPL-3.0
          package_id: com.amaze.filemanager
          added: 2021-10-22
        - name: Fossify File Manager
          url: https://www.fossify.org/apps/file-manager/
          repo: https://github.com/FossifyOrg/File-Manager
          description: File manager with no ads or tracking that works without internet access.
          platforms:
            - android
          license: GPL-3.0
          package_id: org.fossify.filemanager
          added: 2026-07-04
        - name: Ghost Commander
          url: https://f-droid.org/packages/com.ghostsq.commander/
          repo: https://sourceforge.net/p/ghostcommander/svn/HEAD/tree/
          description: Dual-panel file manager.
          platforms:
            - android
          package_id: com.ghostsq.commander
          added: 2021-10-22
        - name: Material Files
          url: https://github.com/zhanghai/MaterialFiles
          repo: https://github.com/zhanghai/MaterialFiles
          description: Material Design file manager with root, archive, FTP, SFTP, SMB and WebDAV support.
          platforms:
            - android
          license: GPL-3.0
          package_id: me.zhanghai.android.files
          added: 2021-10-22
  - title: Android Keyboard
    avoid:
      items:
        - name: GBoard (Google)
          tosdr: en_217
        - name: SwiftKey
          tosdr: en_244
    recommend:
      entries:
        - name: AnySoftKeyboard
          url: https://anysoftkeyboard.github.io/
          repo: https://github.com/AnySoftKeyboard/AnySoftKeyboard
          description: Keyboard with more than 50 languages through add-on packs, plus themes.
          platforms:
            - android
          license: Apache-2.0
          added: 2020-12-22
        - name: FlorisBoard
          url: https://florisboard.org/
          repo: https://github.com/florisboard/florisboard
          description: Customizable keyboard with themes and add-ons, still in beta.
          platforms:
            - android
          license: Apache-2.0
          package_id: dev.patrickgold.florisboard
          added: 2020-12-22
        - name: FUTO Keyboard
          url: https://keyboard.futo.tech/
          repo: https://gitlab.futo.org/keyboard/latinime
          description: Keyboard that works fully offline, including voice input, swipe typing and autocorrect.
          platforms:
            - android
          tags:
            - offline
          caveats:
            - source-available
          added: 2024-07-01
        - name: HeliBoard
          url: https://github.com/HeliBorg/HeliBoard
          repo: https://github.com/HeliBorg/HeliBoard
          description: Maintained fork of OpenBoard with glide typing, custom dictionaries and themes, and no internet permission.
          platforms:
            - android
          license: GPL-3.0
          package_id: helium314.keyboard
          added: 2024-04-08
        - name: Indic Keyboard
          url: https://gitlab.com/indicproject/indic-keyboard
          repo: https://gitlab.com/indicproject/indic-keyboard
          description: Keyboard for typing in Indic languages alongside English.
          platforms:
            - android
          package_id: org.smc.inputmethod.indic
          added: 2021-10-01
        - name: Simple Keyboard
          url: https://github.com/rkkr/simple-keyboard
          repo: https://github.com/rkkr/simple-keyboard
          description: Minimal keyboard under 1 MB whose only permission is vibrate.
          platforms:
            - android
          license: Apache-2.0
          package_id: rkr.simplekeyboard.inputmethod
          added: 2021-10-22
  - title: Android Gallery
    intro: Your photos show where you've been and who you were with, including friends and family who never agreed to be in anyone's cloud. Pick a gallery that keeps them on your phone.
    callouts:
      - type: note
        text: To store and back up your photos privately, see [Photo Storage](#photo-storage).
    avoid:
      items:
        - name: Google Photos
          reason: Google [collects a lot of data](https://policies.google.com/privacy?hl=en-US#infocollect) and scans your photos, which once [got a father reported to police](https://petapixel.com/2022/08/22/google-flags-photos-of-fathers-sick-son-as-child-abuse-informs-police/) over pictures of his sick son taken for a doctor.
        - name: Amazon Photos
          reason: gathers similar data from your library, as Amazon's [examples list](https://www.amazon.com/gp/help/customer/display.html?nodeId=GX7NJQ4ZB8MHFRNJ) shows.
        - name: Samsung, Huawei, Xiaomi and other stock galleries
    recommend:
      entries:
        - name: Aves
          url: https://github.com/deckerst/aves
          repo: https://github.com/deckerst/aves
          description: Gallery and metadata explorer that can view, edit and remove photo metadata such as location.
          platforms:
            - android
          license: BSD-3-Clause
          package_id: deckers.thibault.aves.libre
          added: 2024-01-22
        - name: Fossify Gallery
          url: https://www.fossify.org/apps/gallery/
          repo: https://github.com/FossifyOrg/Gallery
          description: Photo and video gallery with no ads, a fork of Simple Gallery.
          platforms:
            - android
          license: GPL-3.0
          package_id: org.fossify.gallery
          added: 2024-01-22
  - title: Android Launcher
    avoid:
      intro: Launchers from the Play Store may carry ads or trackers and ask for permissions they don't need.
      items: []
    recommend:
      entries:
        - name: Bliss Launcher
          url: https://gitlab.e.foundation/e/os/BlissLauncher3
          repo: https://gitlab.e.foundation/e/os/BlissLauncher3
          description: Default launcher of /e/OS, with app folders and notification badges on icons.
          platforms:
            - android
          added: 2022-09-28
        - name: KISS
          url: https://kisslauncher.com/
          repo: https://github.com/Neamar/KISS
          description: Search-first launcher that finds apps, contacts and settings as you type.
          platforms:
            - android
          license: GPL-3.0
          package_id: fr.neamar.kiss
          added: 2021-06-01
        - name: Kvaesitso
          url: https://kvaesitso.mm20.de/
          repo: https://github.com/MM2-0/Kvaesitso
          description: Search-focused launcher that finds apps, contacts, files and more from one search bar.
          platforms:
            - android
          license: GPL-3.0
        - name: Lawnchair
          url: https://lawnchair.app/
          repo: https://github.com/LawnchairLauncher/lawnchair
          description: Launcher in the style of the Pixel Launcher, with more customization.
          platforms:
            - android
          added: 2021-06-01
        - name: Olauncher
          url: https://github.com/tanujnotes/Olauncher
          repo: https://github.com/tanujnotes/Olauncher
          description: Minimal text-only launcher with no ads, meant to cut your screen time.
          platforms:
            - android
          license: GPL-3.0
          package_id: app.olauncher
          added: 2021-06-01
        - name: Pie Launcher
          url: https://github.com/markusfisch/PieLauncher
          repo: https://github.com/markusfisch/PieLauncher
          description: Launcher that opens apps from a pie menu instead of a grid of icons.
          platforms:
            - android
          license: MIT
          package_id: de.markusfisch.android.pielauncher
          added: 2022-01-14
  - title: Android SMS
    recommend:
      entries:
        - name: Fossify Messages
          url: https://www.fossify.org/apps/messages/
          repo: https://github.com/FossifyOrg/Messages
          description: SMS and MMS app with no ads that works without internet access, a fork of Simple SMS Messenger.
          platforms:
            - android
          license: GPL-3.0
        - name: QUIK
          url: https://github.com/quik-sms/quik
          repo: https://github.com/quik-sms/quik
          description: SMS and MMS app, a maintained fork of QKSMS.
          platforms:
            - android
          license: GPL-3.0

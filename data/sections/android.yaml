  - title: Android Debloat Tools
    avoid:
      items:
        - name: ADB AppControl
          reason: A simple adb wrapper with a [terrible privacy policy](https://adbappcontrol.com/en/terms/) to collect things like device information and what applications you install/uninstall.
    recommend:
      entries:
        - name: Universal Android Debloater Next Generation
          url: https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/
          description: Cross-platform GUI written in Rust using ADB to debloat non-rooted android devices. Improve your privacy, the security and battery life of your device.
          repo: https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/
          added: 2025-08-06
  - title: Android Dialer
    avoid:
      items: []
      intro: Third-party dialers found on the play store. They may contain ads/trackers and may ask for unnecessary permissions.
    recommend:
      entries:

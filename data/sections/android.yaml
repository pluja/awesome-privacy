        - name: SwiftKey
          tosdr: en_244
    recommend:
      entries:
        - name: AnySoftKeyboard
          url: https://anysoftkeyboard.github.io/
          description: The only Android keyboard you'll ever need. Free as in speech and Free as in beer.
          added: 2020-12-22
        - name: FlorisBoard
          url: https://github.com/florisboard/florisboard
          description: FlorisBoard is a free and open-source keyboard for Android 6.0+ devices. It aims at being modern, user-friendly and customizable while fully respecting your privacy. Currently in early-beta state.
          repo: https://github.com/florisboard/florisboard
          package_id: dev.patrickgold.florisboard
          added: 2020-12-22
        - name: Futo Keyboard
          url: https://keyboard.futo.tech/
          description: A modern keyboard that respects your privacy and security, with features such as offline voice input, swipe typing and smart autocorrect.
          added: 2024-07-01
          tags:
            - offline
        - name: Heliboard
          url: https://github.com/HeliBorg/HeliBoard
          description: A privacy-conscious and customizable open-source keyboard, based on AOSP / OpenBoard with many additional features and improvements, including support for custom dictionaries, themes, and glide typing.
          repo: https://github.com/HeliBorg/HeliBoard
          package_id: helium314.keyboard
          added: 2024-04-08
        - name: Indic Keyboard
          url: https://gitlab.com/indicproject/indic-keyboard
          description: Indic Keyboard is a versatile keyboard for Android users who wish to use Indic and Indian languages to type messages, compose emails and generally prefer to use them in addition to English on their phone.
          repo: https://gitlab.com/indicproject/indic-keyboard
          package_id: org.smc.inputmethod.indic
          added: 2021-10-01
        - name: OpenBoard
          url: https://github.com/openboard-team/openboard
          status: inactive
          description: OpenBoard is a 100% foss keyboard based on AOSP, with no dependency on Google binaries, that respects your privacy. It is no longer updated, but still works.
          repo: https://github.com/openboard-team/openboard
          added: 2020-12-22
        - name: Simple Keyboard
          url: https://github.com/rkkr/simple-keyboard
          description: Simply keyboard and nothing more.
          repo: https://github.com/rkkr/simple-keyboard
          package_id: rkr.simplekeyboard.inputmethod
          added: 2021-10-22
  - title: Android Gallery
    intro: Your phone gallery is a deeply personal aspect of your life, it may contain images and videos that capture intimate moments, locations, and people important to you. Protecting its privacy is essential to prevent misuse of this information, not only for you, but it also ensures the privacy of friends and family captured in these photos, who may not consent to having their images shared.
    callouts:
      - type: note
        text: For a private way to store and backup your photos see [Photo Storage](#photo-storage) section.
    avoid:
      items:
        - name: Google Photos
          reason: has privacy issues. They collect a lot of data about you, which you can see in their [privacy policy](https://policies.google.com/privacy?hl=en-US#infocollect). Google can scan your photos and might flag them for different reasons, as shown in this [incident](https://petapixel.com/2022/08/22/google-flags-photos-of-fathers-sick-son-as-child-abuse-informs-police/). They also use your photos to improve their AI technology.
        - name: Amazon Photos
          reason: also has similar privacy problems. Like Google Photos, it gathers a lot of information from your photo gallery. You can see a bit of what kind of data they collect in their [**examples** list](https://www.amazon.com/gp/help/customer/display.html?nodeId=468496&ref_=footer_privacy#GUID-8966E75F-9B92-4A2B-BFD5-967D57513A40__SECTION_87C837F9CCD84769B4AE2BEB14AF4F01).
        - name: Samsung, Huawei, Xiaomi, etc.
          reason: Gallery
    recommend:
      entries:
        - name: Aves
          url: https://github.com/deckerst/aves
          description: Beautiful gallery and metadata explorer app, built for Android with Flutter.
          repo: https://github.com/deckerst/aves
          package_id: deckers.thibault.aves.libre
          added: 2024-01-22
        - name: Fossify Gallery
          url: https://github.com/FossifyOrg/Gallery
          description: Fork of Simple Gallery. Browse your memories without any interruptions with this photo and video gallery.
          repo: https://github.com/FossifyOrg/Gallery
          package_id: org.fossify.gallery
          added: 2024-01-22

title: Search Engines
slug: search-engines
intro: Your searches say more about you than almost anything else, and the big engines log them to build ad profiles. These don't profile you, and several run their own index instead of reselling Google's or Bing's results.
avoid:
  items:
    - name: Google
      reason: police can get the IP address of everyone who searched a term from Google, a practice Colorado upheld in 2023.
      tosdr: en_217
      source: https://statecourtreport.org/our-work/analysis-opinion/colorado-supreme-court-upholds-controversial-google-keyword-warrant
      site: https://www.google.com/
    - name: Bing
      reason: in 2020 an unsecured Bing server exposed 6.5TB of logs with users' search queries and locations.
      tosdr: en_244
      source: https://www.wizcase.com/blog/bing-leak-research/
      site: https://www.bing.com/
    - name: Yahoo!
      reason: a 2013 breach hit all 3 billion Yahoo accounts, which Yahoo admitted only in 2017.
      tosdr: en_309
      source: https://techcrunch.com/2017/10/03/yahoo-says-all-3b-accounts-were-impacted-by-2013-breach-not-1b-as-thought
      site: https://www.yahoo.com/
    - name: Yandex
      reason: in 2025 researchers found its Android apps, Yandex Search among them, secretly linked browsing to device IDs.
      tosdr: en_860
      source: https://localmess.github.io/
      site: https://yandex.com/
recommend:
  entries:
    - name: Brave Search
      url: https://search.brave.com
      description: Search engine with [its own independent index](https://brave.com/search-independence/), from the makers of Brave.
      added: 2021-07-09
    - name: DuckDuckGo
      url: https://duckduckgo.com
      description: Search engine that doesn't build a profile on you, with results drawn largely from Bing.
      added: 2021-05-25
    - name: Marginalia
      url: https://marginalia-search.com/
      repo: https://github.com/MarginaliaSearch/MarginaliaSearch
      description: Independent search engine with its own crawler and index that favors text-heavy, non-commercial pages.
      tags:
        - self-host
      added: 2026-07-04
    - name: Mojeek
      url: https://www.mojeek.com/
      description: UK search engine with its own crawler and index and a no-tracking policy.
      added: 2026-11-02
    - name: Qwant
      url: https://www.qwant.com/
      description: French search engine, hosted in the EU, that doesn't track your searches.
      added: 2020-12-07
    - name: SearXNG
      url: https://docs.searxng.org/
      repo: https://github.com/searxng/searxng
      description: Metasearch engine that queries other search services for you; use a [public instance](https://searx.space/) or host your own.
      license: AGPL-3.0
      tags:
        - self-host
      added: 2022-07-11
    - name: YaCy
      url: https://yacy.net/
      repo: https://github.com/yacy/yacy_search_server
      description: Peer-to-peer search engine where every user runs a node and shares the index.
      tags:
        - p2p
      added: 2026-07-04

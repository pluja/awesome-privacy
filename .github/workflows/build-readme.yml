name: Build README

# After a merge: stamp `added` on new entries, regenerate README.md and commit both,
# so contributors only ever edit data/.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/build-readme.ts"
      - "scripts/data.ts"

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Build from the current tip of main, not the commit that triggered the run,
      # so a queued run after quick successive merges still pushes cleanly.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node scripts/stamp-added.ts
      - run: npm run build

      - name: Commit if anything changed
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git add data README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate README"
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main

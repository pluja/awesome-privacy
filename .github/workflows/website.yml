name: Website

# Builds awesomeprivacy.org from data/. Pull requests only build it, with a read-only token;
# the deploy job runs for main alone and is the only one that can write to Pages. Build README
# commits stamps and logos with the workflow token, which starts no workflows, so its finished
# runs trigger a deploy here; the weekly run lets "New" badges expire.

on:
  push:
    branches: [main]
    paths: &paths
      - "data/**"
      - "schema/**"
      - "scripts/data.ts"
      - "scripts/labels.ts"
      - "misc/Contributing.md"
      - "website/**"
      - "package-lock.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths: *paths
  workflow_run:
    workflows: ["Build README"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: npm run check
        working-directory: website
      - run: npm run build
        working-directory: website

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
